<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="card">
    <h2>Student Management</h2>
    <p>Teacher Portal</p>

    <!-- tab buttons -->
    <div class="tabs">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Register</button>
    </div>

    <!-- login section -->
    <div class="tab-panel active" id="panelLogin">
        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="teacher@school.com">
            <div class="form-error" id="loginEmailErr"></div>

            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Password">
            <div class="form-error" id="loginPasswordErr"></div>

            <button type="submit" id="loginBtn"><span id="loginBtnText">Login</span></button>
        </form>
        <p class="hint">No account? Click <strong>Register</strong></p>
    </div>

    <!-- register section -->
    <div class="tab-panel" id="panelRegister">
        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="Your name">
            <div class="form-error" id="regNameErr"></div>

            <label>Email</label>
            <input type="email" id="regEmail" placeholder="teacher@school.com">
            <div class="form-error" id="regEmailErr"></div>

            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Min 6 characters">
            <div class="form-error" id="regPasswordErr"></div>

            <label>Confirm Password</label>
            <input type="password" id="regConfirm" placeholder="Repeat password">
            <div class="form-error" id="regConfirmErr"></div>

            <button type="submit" id="registerBtn"><span id="registerBtnText">Create Account</span></button>
        </form>
        <p class="hint">Have an account? Click <strong>Login</strong></p>
    </div>
</div>

<div id="toastContainer"></div>

<script src="login.js"></script>
</body>
</html>
