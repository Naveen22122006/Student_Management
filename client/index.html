<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Student Management System</h1>
            <span id="statusText">Connecting...</span>
        </div>
    </header>

    <main>

        <!-- Statistics -->
        <section class="stats">

            <div class="stat">
                <h3>Total Students</h3>
                <p id="statTotalStudents">0</p>
            </div>

            <div class="stat">
                <h3>Total Courses</h3>
                <p id="statCoursesCount">0</p>
            </div>

            <div class="stat">
                <h3>Average Age</h3>
                <p id="statAvgAge">0</p>
            </div>

        </section>

        <div class="layout">

            <!-- Student Form -->
            <section class="card">

                <div class="form-heading">
                    <div>
                        <h2 id="formTitle">Add Student</h2>
                        <span id="formBadge" class="form-badge">New</span>
                    </div>
                </div>

                <form id="studentForm">

                    <input type="hidden" id="studentId">

                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter student name" required>

                    <label for="rollNo">Roll Number</label>
                    <input type="text" id="rollNo" placeholder="Enter roll number" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter email" required>

                    <label for="course">Course</label>
                    <input type="text" id="course" placeholder="Enter course" required>

                    <label for="age">Age</label>
                    <input type="number" id="age" min="1" max="100" placeholder="Enter age" required>

                    <div class="buttons">

                        <button type="submit" id="submitBtn">
                            <span id="submitBtnText">Add Student</span>
                        </button>

                        <button type="button" id="cancelEditBtn" class="cancel hidden">
                            Cancel
                        </button>

                    </div>

                </form>

            </section>

            <!-- Student List -->
            <section class="card students-card">

                <div class="list-header">

                    <div>
                        <h2>Students</h2>
                        <span id="studentCountBadge">0 records</span>
                    </div>

                    <div class="filters">

                        <input type="text" id="searchInput" placeholder="Search students...">

                        <select id="courseFilter">
                            <option value="all">All Courses</option>
                        </select>

                    </div>

                </div>

                <div id="loadingSpinner" class="loading">
                    Loading students...
                </div>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Roll No</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Course</th>
                                <th>Age</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="studentTableBody"></tbody>

                    </table>

                </div>

                <div id="emptyState" class="empty hidden">
                    <h3>No students found</h3>
                    <p>Add a student using the form.</p>
                </div>

            </section>

        </div>

    </main>

    <div id="toastContainer"></div>

    <script src="script.js"></script>

</body>

</html>
